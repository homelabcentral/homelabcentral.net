"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$sudo\
$hostname\
$directory\
$git_branch\
$git_status\
$status\
$fill\
$cmd_duration\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$package\
$conda\
$memory_usage\
$battery\
$time\
$line_break\
$character"""

# # right_format appears in the same line as the prompt, use it carefully
# right_format = """
# """

add_newline = false

palette = 'catppuccin_mocha'

[fill]
symbol = ' '
style = ''

[os]
disabled = false
style = "fg:flamingo"
format = '[ $symbol ]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:red"
style_root = "fg:red bold"
format = '[ $user ]($style)'
disabled = false

[sudo]
disabled = false
symbol = '󱐋󱐋'
#symbol = ''or ''or '' or ''
style = "fg:red"
format = '[$symbol ]($style)'

[hostname]
disabled = false
ssh_only = true
trim_at = "."
ssh_symbol = '' # '󰌘' or '󰢹'
style = "fg:red"
format = '[(@ $hostname $ssh_symbol )]($style)'
# format = '[(@ $hostname ($ssh_symbol ))]($style)'
# format = '[(@ $hostname )[$ssh_symbol]]($style)'
# format = '@ ($ssh_symbol )([$hostname]($style))'

[directory]
style = "fg:peach"
format = "[( $read_only)](fg:peach)[ $path ]($style)"
truncation_length = 3
# truncation_symbol = "…/"
truncate_to_repo = true
fish_style_pwd_dir_length = 1
read_only = ''
disabled = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"Code" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:yellow"
format = '[ $symbol](fg:yellow)[ $branch ]($style)'
disabled = false

[git_status]
style = "fg:yellow"
format = '[(\[$all_status$ahead_behind\])]($style)'
disabled = false

[status]
disabled = false
style = 'fg:green'
success_style = 'fg:green'
failure_style = 'fg:red'
format = '[ $symbol ($status )]($style)'
map_symbol = true
# format = '[$symbol $status]($style)'
symbol = ''
success_symbol = ''
# success_symbol = '' # settings success symbol to a non-empty character will also fill the $status and it will display the code 0 along with the success symbol
not_executable_symbol = ''
not_found_symbol = '󰦀'
sigint_symbol = '󰗼'
signal_symbol = '󰖔'

[nodejs]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[c]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[cpp]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[rust]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[golang]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[php]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[java]
symbol = "󰅶"
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[kotlin]
symbol = ""
style = "fg:green"
format = '[ $symbol $version ]($style)'
disabled = false

[haskell]
symbol = ""
style = "fg:green"
# format = '[[ $symbol( $version) ](fg:green)]($style)'
format = '[ $symbol $version ]($style)'
disabled = false

[python]
symbol = ""
style = "fg:green"
# format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:green)]($style)'
format = '[ $symbol $version(#$virtualenv) ]($style)'
disabled = false

[package]
disabled = false
symbol = ""
style = "fg:teal"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "fg:sapphire"
format = '[ $symbol( $context) ]($style)'
disabled = false

[conda]
symbol = ""
style = "fg:sapphire"
format = '[ $symbol $environment ]($style)'
ignore_base = false
disabled = false

[battery]
disabled = false
# format = '[[](inverted $style)[ $symbol $percentage ]($style fg:crust)[]($style fg:surface0)]($style)'
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰁽'
empty_symbol = '󰂎'
unknown_symbol = '󰂃'
format = '[ $symbol $percentage ]($style)'

[[battery.display]]
threshold = 100
style = "fg:flamingo"
discharging_symbol = '󰁹'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 90
style = "fg:flamingo"
discharging_symbol = '󰂂'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 80
style = "fg:flamingo"
discharging_symbol = '󰂁'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 70
style = "fg:flamingo"
discharging_symbol = '󰂀'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 60
style = "fg:flamingo"
discharging_symbol = '󰁿'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 50
style = "fg:flamingo"
discharging_symbol = '󰁾'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 40
style = "bold fg:flamingo"
discharging_symbol = '󰁽'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 30
style = "bold fg:flamingo"
discharging_symbol = '󰁼'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 20
style = "bold fg:flamingo"
discharging_symbol = '󰁻'
charging_symbol = '󰂄'

[[battery.display]]
threshold = 10
style = "bold fg:flamingo"
discharging_symbol = '󰁺'
charging_symbol = '󰂄'

[time]
disabled = false
use_12hr = true
time_format = "%I:%M %p"
style = "fg:lavender"
format = '[ $time ]($style)'
# format = '[[](fg:lavender)[  ](fg:crust bg:lavender)$time ]($style)[](bg:base fg:lavender)'

[line_break]
disabled = false

[memory_usage]
disabled = false
threshold = -1
symbol = ''
style = "fg:pink"
# format = '[$symbol ${ram} ]($style)'
format = '[ $symbol ${ram_pct} ]($style)'

[character]
disabled = false
success_symbol = ' [](bold fg:green)'
error_symbol = ' [](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
style = "fg:text"
format = "[  in $duration ]($style)"
disabled = false
show_notifications = false
min_time_to_notify = 45000
min_time = 2_000

