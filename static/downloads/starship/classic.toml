"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ ](red)\
$os\
[ ](bg:red)\
[](bg:surface0 fg:red)\
$username\
$sudo\
$hostname\
$directory\
$git_branch\
$git_status\
$status\
$fill\
$memory_usage\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$package\
$conda\
$time\
$battery\
$line_break\
$character"""

# right_format appears in the same line as the prompt, use it carefully
right_format = """
$cmd_duration
"""

add_newline = false

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"
format = '[ $symbol]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[fill]
symbol = ' '
style = 'bg:surface0'

[username]
show_always = true
style_user = "bg:surface0 fg:red"
style_root = "bg:surface0 fg:red"
format = '[ $user ]($style)'

[directory]
style = "bg:surface0 fg:peach"
format = "[[](bg:peach fg:surface0) ($read_only )](bg:peach fg:crust)[󰉋 ](bg:peach fg:crust)[](bg:surface0 fg:peach)[ $path ]($style)"
truncation_length = 3
# truncation_symbol = "…/"
truncate_to_repo = true
fish_style_pwd_dir_length = 1
read_only = ''

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"Code" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:surface0 fg:yellow"
format = '[](bg:yellow fg:surface0)[ $symbol ](fg:crust bg:yellow)[](fg:yellow bg:surface0)[ $branch ]($style)'

[git_status]
style = "bg:surface0 fg:yellow"
format = '[[($all_status$ahead_behind )](fg:yellow bg:surface0)]($style)'

[status]
disabled = false
style = 'fg:green bg:surface0'
success_style = 'fg:green bg:surface0'
failure_style = 'fg:red bg:surface0'
format = '[$symbol ($status )]($style)'
map_symbol = true
# format = '[$symbol $status]($style)'
symbol = ''
success_symbol = ''
# success_symbol = '' # settings success symbol to a non-empty character will also fill the $status and it will display the code 0 along with the success symbol
not_executable_symbol = ''
not_found_symbol = '󰦀'
sigint_symbol = '󰗼'
signal_symbol = '󰖔'

[nodejs]
symbol = ""
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[c]
symbol = ""
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[cpp]
symbol = ""
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[rust]
symbol = ""
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[golang]
symbol = ""
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[php]
symbol = ""
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[java]
symbol = "󰅶"
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:green bg:surface0"
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:green bg:surface0"
# format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version) ]($style)'

[python]
symbol = ""
style = "fg:green bg:surface0"
# format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'
format = '[[](bg:surface0 fg:green) $symbol ](bg:green fg:crust)[](bg:green fg:surface0)[( $version)(\(#$virtualenv\)) ]($style)'

[package]
disabled = false
symbol = ""
style = "fg:teal bg:surface0"
format = '[](bg:surface0 fg:teal)[ $symbol ](bg:teal fg:crust)[](bg:teal fg:surface0)[( $version )]($style)'


[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = ""
style = "fg:sapphire bg:surface0"
format = '[[](bg:surface0 fg:sapphire) $symbol ](bg:sapphire fg:crust)[](bg:sapphire fg:surface0)[ $environment ]($style)'
ignore_base = false
disabled = false

[time]
disabled = false
use_12hr = true
time_format = "%I:%M %p"
style = "lavender bg:surface0"
# format = '[[](bg:surface0 fg:lavender)[  $time ](fg:crust bg:lavender)]($style)'
format = '[[](bg:surface0 fg:lavender)[  ](fg:crust bg:lavender)[](bg:lavender fg:surface0) $time ]($style)'

[sudo]
disabled = false
symbol = '󱐋'
#symbol = ''or ''or '' or ''
style = "bg:surface0 fg:red"
format = '[$symbol ]($style)'

[hostname]
disabled = false
ssh_only = true
ssh_symbol = ''
style = "bg:surface0 fg:red"
format = '[(@$hostname )($symbol )]($style)'

[line_break]
disabled = false

[memory_usage]
disabled = false
threshold = -1
symbol = ''
# format = '[$symbol ${ram} ]($style)'
format = '[[](bg:surface0 fg:pink) $symbol ](bg:pink fg:crust)[ ](bg:pink fg:surface0)[ ${ram_pct} ]($style)'
style = "bg:surface0 fg:pink"

[character]
disabled = false
success_symbol = ' [](bold fg:green)'
error_symbol = ' [](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000
min_time = 2_000

[battery]
disabled = false
format = '[[](inverted $style)[ $symbol $percentage ]($style fg:crust)[](inverted $style fg:base)]($style)'
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰁽'
empty_symbol = '󰂎'
unknown_symbol = '󰂃'

[[battery.display]]
threshold = 100
style = "bold surface0 bg:green"
discharging_symbol = '󰂂'
charging_symbol = '󰂅'

[[battery.display]]
threshold = 90
style = "fg:surface0 bg:yellow"
discharging_symbol = '󰂂'
charging_symbol = '󰂋'

[[battery.display]]
threshold = 80
style = "fg:surface0 bg:yellow"
discharging_symbol = '󰂁'
charging_symbol = '󰂊'

[[battery.display]]
threshold = 70
style = "fg:surface0 bg:yellow"
discharging_symbol = '󰂀'
charging_symbol = '󰢞'

[[battery.display]]
threshold = 60
style = "fg:surface0 bg:yellow"
discharging_symbol = '󰁿'
charging_symbol = '󰂉'

[[battery.display]]
threshold = 50
style = "fg:surface0 bg:yellow"
discharging_symbol = '󰁾'
charging_symbol = '󰢝'

[[battery.display]]
threshold = 40
style = "fg:surface0 bg:maroon"
discharging_symbol = '󰁽'
charging_symbol = '󰂈'

[[battery.display]]
threshold = 30
style = "fg:surface0 bg:maroon"
discharging_symbol = '󰁼'
charging_symbol = '󰂇'

[[battery.display]]
threshold = 20
style = "fg:surface0 bg:red"
discharging_symbol = '󰁻'
charging_symbol = '󰂆'

[[battery.display]]
threshold = 10
style = "bold surface0 bg:red"
discharging_symbol = '󰂃'
charging_symbol = '󰢜'

